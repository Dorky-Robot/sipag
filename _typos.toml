# _typos.toml — spelling whitelist for sipag
#
# Domain-specific terms and proper nouns that typos should not flag.
# Documentation: https://github.com/crate-ci/typos/blob/master/docs/reference.md

[files]
# Minified vendor JS is full of single/double-letter identifiers that
# typos parses as misspelled words (e.g. `ue` flagged as "use", `Pn`
# as "On"). These files come from upstream and we don't author them,
# so spell-checking them produces only noise.
extend-exclude = [
    "web/public/js/*.min.js",
    "web/public/vendor/",
]

[default.extend-words]
# Project names and stack components
sipag   = "sipag"     # this project
kubo    = "kubo"      # chain-of-thought planner in the dorky robot stack
tao     = "tao"       # decision layer in the dorky robot stack
ratatui = "ratatui"   # TUI framework crate (not "ratatouille")

# Regex fragments in shell scripts (e.g., (ba)?sh matches bash/sh)
ba = "ba"

# Rich Hickey's term: to interweave/braid together (used in /consult agent)
complecting  = "complecting"
complection  = "complection"
complected   = "complected"

# Intentional misspellings in test fixtures (Levenshtein distance tests)
imge = "imge"
abd  = "abd"
