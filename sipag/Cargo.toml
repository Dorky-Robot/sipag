[package]
license = "MIT OR Apache-2.0"
name = "sipag"
version = "3.0.10"
edition = "2021"
description = "Sandbox launcher for Claude Code — single binary with CLI and TUI"

[[bin]]
name = "sipag"
path = "src/main.rs"

[dependencies]
sipag-core = { path = "../sipag-core" }
# Direct dependency on the extracted pubsub crate. sipag-core still
# re-exports it at the old `sipag_core::pubsub::…` path for back-compat,
# but new code in the binary imports from `sipag_pubsub` directly.
sipag-pubsub = { path = "../sipag-pubsub" }
# Direct dependency on katulong-client — sipag-core re-exports it at
# `sipag_core::katulong::…` for back-compat, but new code in the
# binary imports `katulong_client::…` directly. Used for the async
# HTTP client (`KatulongAsyncClient`) introduced for #527.
katulong-client = { path = "../katulong-client", default-features = false }
# The dispatch action. Encapsulates the WS-attach + paste + submit
# flow that used to live in `serve/htmx.rs::dispatch_via_attach_client`.
# The web UI and the CLI both call `sipag_dispatch::dispatch` for
# the agent launch.
sipag-dispatch = { path = "../sipag-dispatch" }
# Host topology config. sipag-core re-exports at the old
# `sipag_core::hosts::…` path; new code imports `sipag_mesh::…`
# directly.
sipag-mesh = { path = "../sipag-mesh" }
# OKR + Task + Role + Project + Observation domain. sipag-core
# re-exports at the old `sipag_core::board::…` path; new code
# imports `sipag_board::…` directly.
sipag-board = { path = "../sipag-board" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `sipag serve` — axum server that proxies the configured katulongs
# and serves the maud-rendered HTMX frontend in `web/public/`. No
# feature gate yet; if this outgrows the sipag crate we'll extract it.
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "1"
url = "2"
# Spike: HTMX server-side rendering. maud gives compile-checked HTML
# templates with no runtime template language. Tiny dep, zero new
# tooling — pairs with htmx.min.js dropped into web/public/.
maud = "0.26"
# Workers use async fns in a trait object — async_trait keeps the
# trait dyn-compatible without the unstable `dyn AsyncFn` feature.
async-trait = "0.1"
# Dev-loop accelerator. tower-livereload injects a tiny browser-side
# script that polls /livereload; the layer's version flips on every
# server restart, which prompts the browser to reload. Only mounted
# when SIPAG_DEV=1 — production never sees it.
tower-livereload = "0.9"
# Filesystem watcher for the dev loop. When SIPAG_DEV=1 we watch
# web/public/ and call the livereload reloader on change — that way
# CSS/JS edits don't have to round-trip through a server restart.
notify = "6"
# Used by the dispatch v2 path to compile static wait_for patterns
# that the katulong attach client matches against its rolling buffer.
regex = "1"

# WebAuthn lives in sipag-core::auth — the binary crate just wires
# handlers around the AuthStore and WebAuthnService.

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
# In-process axum integration tests for the auth surface.
axum-test = "16"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
serde_json = "1"
