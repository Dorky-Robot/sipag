[package]
license = "MIT OR Apache-2.0"
name = "sipag-lens"
version = "0.1.0"
edition = "2021"
description = "Lens-worker primitive for sipag — runtime that takes a lens definition + bridge + corpus and produces structured observations + typed verb calls. Phase 1 #3 of modules.md."

[dependencies]
# Lens-workers compose two prior extractions: the bridge wire
# (chat / embed) and the corpus (storage). Default features ON so
# the typical caller (sipag's serve binary) gets the production
# embedder out of the box.
ollama-bridge-client = { path = "../ollama-bridge-client" }
sipag-corpus = { path = "../sipag-corpus" }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
tokio = { version = "1", features = ["time", "macros"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
