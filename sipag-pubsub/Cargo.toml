[package]
license = "MIT OR Apache-2.0"
name = "sipag-pubsub"
version = "0.1.0"
edition = "2021"
description = "File-backed durable pub/sub broker for sipag — JSONL-per-topic with live broadcast fanout"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
