[package]
name = "sipag-core"
version = "3.0.2"
edition = "2021"
description = "Core library for sipag — sandbox launcher for Claude Code"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
# Auth scaffolding (Track A) — RNG for setup tokens + session tokens.
# webauthn-rs lives in the binary crate; sipag-core just persists
# the user / credential / session metadata as TOML.
rand = "0.8"
