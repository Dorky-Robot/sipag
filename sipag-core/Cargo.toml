[package]
license = "MIT OR Apache-2.0"
name = "sipag-core"
version = "3.0.2"
edition = "2021"
description = "Core library for sipag — sandbox launcher for Claude Code"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
# llm.rs talks to ollama over HTTP. reqwest is already pulled in
# transitively through the binary crate; declaring it here keeps the
# lib self-contained.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = { version = "0.3", default-features = false }
# Auth subsystem — ported from katulong-auth.
thiserror = "1"
# `net`/`io-util`/`time` needed by the katulong WS attach client (see
# docs/dispatch-implementation-plan.md §5). The pre-existing `sync, fs,
# rt, macros` set covered the synchronous helpers; we widen for the
# tokio-tungstenite path.
tokio = { version = "1", features = ["sync", "fs", "rt", "macros", "net", "io-util", "time"] }
# WebSocket client for the katulong attach path. Same rustls stack
# `reqwest` already pulls in, so no duplicate TLS implementations.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "connect", "handshake"] }
# Used by the attach client's `wait_for` rolling-buffer matcher.
regex = "1"
tracing = "0.1"
scrypt = { version = "0.11", default-features = false, features = ["simple"] }
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = { version = "2", default-features = false }
sha2 = { version = "0.10", default-features = false }
base64 = "0.22"
url = "2"
# SAFETY: the `danger-allow-state-serialisation` feature enables Serde derives
# on `PasskeyRegistration` / `PasskeyAuthentication` so they can live inside
# the `Mutex<HashMap<...>>` challenge stores in `webauthn.rs`. That in-memory
# use is safe. Persisting those types to disk or sending them over the wire
# would open a ceremony-replay vector — upstream named the flag `danger-*` for
# exactly that reason. The flag is ALSO required to serialize finished
# `Passkey` blobs into `Credential.public_key`, which IS long-lived on-disk
# state — that's fine because the completed passkey is what the spec expects
# us to store. Do NOT extend the flag's reach to persist pending ceremony
# state without a security review.
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
