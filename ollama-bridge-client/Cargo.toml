[package]
license = "MIT OR Apache-2.0"
name = "ollama-bridge-client"
version = "0.1.0"
edition = "2021"
description = "Rust client for dorky-robot/ollama-bridge — enqueue LLM jobs, poll for results, with bearer auth + 60s sha256 dedup + body caps. Sipag never talks to ollama directly; it talks to the bridge."

[dependencies]
# Async HTTP. Streamed body reading is required so the per-call
# response-body cap can short-circuit before the full body is
# allocated — same pattern as katulong-client::async_http.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["time", "macros"] }
tracing = "0.1"
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7" }
tempfile = "3"
